name: Soroban CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Build and Test Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check Formatting
        run: cargo fmt --check
      - name: Run Cargo Clippy (Linting)
        run: cargo clippy
      - name: Build WASM Dependencies
        run: cargo build --target wasm32v1-none --release
      - name: Run Unit Tests
        run: cargo test

  frontend:
    name: Build and Test Frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
        working-directory: frontend/afristore-app
      - name: Run Build
        run: npm run build
        working-directory: frontend/afristore-app
      - name: Run Tests
        run: npm run test
        working-directory: frontend/afristore-app

  indexer:
    name: Build and Test Indexer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
        working-directory: indexer
      - name: Run Build
        run: npm run build
        working-directory: indexer
      - name: Run Tests
        run: npm run test
        working-directory: indexer
